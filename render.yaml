services:
  - type: web
    name: prime-hotels-intranet
    runtime: node
    buildCommand: npm ci && npm run build
    startCommand: npm run preview -- --host 0.0.0.0 --port $PORT
    envVars:
      - key: NODE_ENV
        value: production
      - key: SHARP_IGNORE_GLOBAL_LIBVIPS
        value: "1"
