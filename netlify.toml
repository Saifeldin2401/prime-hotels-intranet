[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

[dev]
  command = "npm run dev"
  port = 5173

[[redirects]]
  from = "https://www.phg-connect.com/*"
  to = "https://phg-connect.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# SECURITY NOTE: Content-Security-Policy below uses 'unsafe-inline' for scripts and styles.
# This is required for Vite's development HMR and some third-party UI libraries.
# For production hardening:
# 1. Implement a nonce-based CSP with server-generated nonces
# 2. Use strict-dynamic for scripts loaded via trusted loaders
# 3. Generate hash-based CSP for known inline scripts
# 4. The current policy provides baseline XSS protection but is not maximally strict
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; connect-src 'self' https://api.supabase.co https://*.supabase.co wss://*.supabase.co https://generativelanguage.googleapis.com https://openrouter.ai https://*.openrouter.ai https://api.cloudflare.com https://*.cloudflare.com https://api.groq.com https://*.groq.com https://api-inference.huggingface.co https://huggingface.co https://router.huggingface.co https://api.deepseek.com https://*.hf.co https://*.huggingface.co https://cdn.jsdelivr.net https://*.sentry.io https://date.nager.at https://va.vercel-scripts.com https://*.vercel-scripts.com https://api.open-meteo.com https://api.aladhan.com https://fonts.googleapis.com https://fonts.gstatic.com https://images.unsplash.com https://phg-connect.com https://www.phg-connect.com https://api.pwnedpasswords.com; script-src 'self' 'unsafe-inline' 'unsafe-eval' blob: https://phg-connect.com https://www.phg-connect.com https://va.vercel-scripts.com https://*.vercel-scripts.com; script-src-elem 'self' 'unsafe-inline' 'unsafe-eval' blob: https://phg-connect.com https://www.phg-connect.com https://va.vercel-scripts.com https://*.vercel-scripts.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: https:; font-src 'self' data: https://fonts.gstatic.com; media-src 'self' blob: data: https://*.supabase.co; manifest-src 'self' https://phg-connect.com https://www.phg-connect.com; frame-src 'self' https://www.youtube.com https://youtube.com https://www.youtube-nocookie.com https://player.vimeo.com https://vimeo.com https://*.supabase.co; worker-src 'self' blob:; base-uri 'self'; form-action 'self'; frame-ancestors 'self';"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(self), payment=(), usb=(), magnetometer=(), gyroscope=(), accelerometer=()"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    Cross-Origin-Resource-Policy = "cross-origin"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    Service-Worker-Allowed = "/"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
