<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" href="/favicon.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <script>
    (() => {
      const authSensitivePrefixes = ['/login', '/forgot-password', '/reset-password', '/complete-invite']
      const normalizePathname = (pathname) => {
        if (!pathname) return '/'
        const normalized = pathname.endsWith('/') && pathname.length > 1
          ? pathname.replace(/\/+$/, '')
          : pathname
        return normalized || '/'
      }

      const currentPathname = normalizePathname(window.location.pathname)
      const hasAuthParams =
        /(?:^|[?&])(token_hash|code|access_token|refresh_token)=/i.test(window.location.search)
        || /(?:^|[?&])type=(?:recovery|invite|signup|magiclink|email|email_change)\b/i.test(window.location.search)
        || /(?:^|[#&])(access_token|refresh_token)=/i.test(window.location.hash)

      const isSensitiveEntry = authSensitivePrefixes.some((prefix) =>
        currentPathname === prefix || currentPathname.startsWith(`${prefix}/`)
      ) || hasAuthParams

      if (window.location.hostname !== 'www.phg-connect.com' || !isSensitiveEntry) return

      const hostRedirectKey = '__phg_www_host_redirect_attempted__'
      try {
        if (sessionStorage.getItem(hostRedirectKey) === '1') return
        sessionStorage.setItem(hostRedirectKey, '1')
      } catch {
        // Continue even if sessionStorage is unavailable.
      }

      const target = new URL(window.location.href)
      target.hostname = 'phg-connect.com'
      window.location.replace(target.toString())
    })()
  </script>

<body>
  <div id="root"></div>
  <script>
    (() => {
      window.__PHG_BOOTSTRAP_PROMISE__ = Promise.resolve()
    })()
  </script>
  <script type="module">
    const bootstrapPromise = window.__PHG_BOOTSTRAP_PROMISE__
    if (bootstrapPromise && typeof bootstrapPromise.then === 'function') {
      await bootstrapPromise
    }

    const BOOT_IMPORT_RECOVERY_KEY = '__phg_boot_import_recovery__'

    const isRecoverableImportError = (error) => {
      const message = typeof error?.message === 'string' ? error.message : String(error || '')
      return /Failed to fetch dynamically imported module|Importing a module script failed|ChunkLoadError|Loading chunk \d+ failed|ERR_ABORTED|CORS/i.test(message)
    }

    const clearRuntimeArtifacts = async () => {
      if ('serviceWorker' in navigator) {
        const registrations = await navigator.serviceWorker.getRegistrations()
        await Promise.allSettled(registrations.map((registration) => registration.unregister()))
      }

      if ('caches' in window) {
        const cacheKeys = await caches.keys()
        const staleCacheKeys = cacheKeys.filter((key) => key.startsWith('prime-hotels-'))
        await Promise.allSettled(staleCacheKeys.map((key) => caches.delete(key)))
      }
    }

    try {
      await import('/src/main.tsx')
    } catch (error) {
      if (!isRecoverableImportError(error)) {
        throw error
      }

      const currentUrl = new URL(window.location.href)
      if (sessionStorage.getItem(BOOT_IMPORT_RECOVERY_KEY) !== '1') {
        sessionStorage.setItem(BOOT_IMPORT_RECOVERY_KEY, '1')
        await clearRuntimeArtifacts()
        currentUrl.searchParams.set('__boot_recover', Date.now().toString())
        window.location.replace(currentUrl.toString())
      } else {
        const root = document.getElementById('root')
        if (root) {
          root.innerHTML = `
            <div style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:#f8f6f1;color:#1f3b5b;font-family:system-ui,sans-serif;padding:1.5rem;">
              <div style="max-width:34rem;text-align:center;">
                <h1 style="margin:0 0 0.75rem;font-size:1.35rem;">PHG Connect could not start</h1>
                <p style="margin:0 0 1.25rem;color:#4f6480;">Please refresh this page. If the issue persists, clear site data for phg-connect.com and www.phg-connect.com, then retry your secure link.</p>
              </div>
            </div>
          `
        }
      }
    }
  </script>
</body>
