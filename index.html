  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <script>
    (() => {
      const authSensitivePrefixes = ['/login', '/forgot-password', '/reset-password', '/complete-invite']
      const normalizePathname = (pathname) => {
        if (!pathname) return '/'
        const normalized = pathname.endsWith('/') && pathname.length > 1
          ? pathname.replace(/\/+$/, '')
          : pathname
        return normalized || '/'
      }

      const currentPathname = normalizePathname(window.location.pathname)
      const hasAuthParams =
        /(?:^|[?&])(token_hash|code|access_token|refresh_token)=/i.test(window.location.search)
        || /(?:^|[?&])type=(?:recovery|invite|signup|magiclink|email|email_change)\b/i.test(window.location.search)
        || /(?:^|[#&])(access_token|refresh_token)=/i.test(window.location.hash)

      const isSensitiveEntry = authSensitivePrefixes.some((prefix) =>
        currentPathname === prefix || currentPathname.startsWith(`${prefix}/`)
      ) || hasAuthParams

      if (window.location.hostname !== 'www.altus-advisory.com' || !isSensitiveEntry) return

      const hostRedirectKey = '__altus_www_host_redirect_attempted__'
      try {
        if (sessionStorage.getItem(hostRedirectKey) === '1') return
        sessionStorage.setItem(hostRedirectKey, '1')
      } catch {
        // Continue even if sessionStorage is unavailable.
      }

      const target = new URL(window.location.href)
      target.hostname = 'altus-advisory.com'
      window.location.replace(target.toString())
    })()
  </script>

<body>
  <div id="root"></div>
  <script>
    (() => {
      const cleanupKey = '__phg_index_cleanup_done__'

      window.addEventListener('load', () => {
        window.setTimeout(async () => {
          try {
            if (sessionStorage.getItem(cleanupKey) === '1') return
            sessionStorage.setItem(cleanupKey, '1')
          } catch {
            // Continue even if sessionStorage is unavailable.
          }

          try {
            if ('serviceWorker' in navigator) {
              const registrations = await navigator.serviceWorker.getRegistrations()
              await Promise.allSettled(registrations.map((registration) => registration.unregister()))
            }

            if ('caches' in window) {
              const cacheKeys = await caches.keys()
              const staleCacheKeys = cacheKeys.filter((key) => key.startsWith('prime-hotels-') || key.startsWith('phg-intranet-'))
              await Promise.allSettled(staleCacheKeys.map((key) => caches.delete(key)))
            }
          } catch {
            // Passive cleanup only. Ignore failures.
          }
        }, 0)
      }, { once: true })
    })()
  </script>
  <script type="module" src="/src/main.tsx"></script>
